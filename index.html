<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaleidoscope</title>
<style>
  :root{
    --panel: rgba(14,16,24,.72);
    --edge: rgba(255,255,255,.14);
    --ink: rgba(236,240,255,.92);
    --dim: rgba(236,240,255,.55);
    --accent: #7fd7ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:#000; overflow:hidden;
    font:13px/1.45 ui-sans-serif,-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  #view{display:block; width:100vw; height:100vh; touch-action:none; cursor:grab}
  #view.dragging{cursor:grabbing}

  #refresh{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:9px;
    font:inherit; font-size:12px; letter-spacing:.06em; color:rgba(236,240,255,.72);
    background:rgba(14,16,24,.55); border:1px solid rgba(255,255,255,.13);
    border-radius:999px; padding:9px 17px 9px 14px; cursor:pointer;
    backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4);
    box-shadow:0 10px 34px rgba(0,0,0,.5);
    opacity:.38; transition:opacity .3s, background .2s, border-color .2s, color .2s;
  }
  #refresh:hover{opacity:1; background:rgba(22,26,38,.8); border-color:rgba(255,255,255,.3); color:#fff}
  #refresh:active{transform:translateX(-50%) translateY(1px)}
  #refresh svg{width:14px; height:14px; transition:transform .5s cubic-bezier(.3,1.4,.4,1)}
  #refresh.turn svg{transform:rotate(360deg)}
  #refresh code{
    font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.04em;
    color:var(--accent); opacity:.85;
  }
  #drop{
    position:fixed; inset:0; display:none; place-items:center; pointer-events:none;
    background:rgba(0,0,0,.6); backdrop-filter:blur(3px); z-index:5;
    font-size:15px; letter-spacing:.08em; color:var(--accent);
  }
  #drop.on{display:grid}
</style>
</head>
<body>
<canvas id="view"></canvas>

<button id="refresh" title="New fragment seed">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
  </svg>
  <span>New fragment</span> <code id="seedLabel"></code>
</button>

<div id="drop">release to use as fragment</div>

<script>
(() => {
'use strict';

const cv   = document.getElementById('view');
const ctx  = cv.getContext('2d', { alpha:false });

/* ---------- the object chamber: an offscreen square holding the fragment ---------- */
const CS = 2048;                 // chamber resolution
const CR = CS * 0.46;            // radius the glass chips are confined to
const chamber = document.createElement('canvas');
chamber.width = chamber.height = CS;
const cc = chamber.getContext('2d');

const S = {
  folds: 6,
  spinRate: 0.35,
  driftRate: 1,
  zoom: 1.1,
  spin: 0,
  sx: CS/2, sy: CS/2,          // sample point inside the chamber (derived each frame)
  ox: 0, oy: 0,                // manual offset from dragging
  flow: 1,                     // speed of the automatic sweep
  mode: 'chips',
  img: null,
  circle: false,
  paused: false,
  t: 0,
  seed: 0,
};

/* ---------- seeded randomness: a seed fully determines a fragment ---------- */
function mulberry32(a){
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(1);
const newSeed = () => (Math.random()*0xFFFFFF)|0;

/* ---------- glass chips ---------- */
let chips = [];
const HARMONY = [0, 28, 62, 150, 186, 212, 276, 322];

function makeChips(seed, n = 880){
  S.seed = seed;
  rnd = mulberry32(seed);
  const base = rnd()*360;
  const warm = rnd() < 0.5;
  chips = [];
  for (let i = 0; i < n; i++){
    const a = rnd()*Math.PI*2;
    const r = Math.sqrt(rnd())*CR*0.94;
    const kr = rnd();
    const tiny = i > n*0.55;                      // a fine grain of small bright specks
    chips.push({
      x: CS/2 + Math.cos(a)*r,
      y: CS/2 + Math.sin(a)*r,
      vx: (rnd()-0.5)*0.42,
      vy: (rnd()-0.5)*0.42,
      rot: rnd()*Math.PI*2,
      vrot: (rnd()-0.5)*0.011,
      size: tiny ? 4 + Math.pow(rnd(),1.6)*24
                 : 18 + Math.pow(rnd(), 2.2)*128,
      squash: 0.3 + rnd()*0.95,
      sides: 3 + (rnd()*6|0),
      kind: kr < 0.18 ? 'disc' : kr < 0.33 ? 'ring' : kr < 0.45 ? 'sliver' : 'poly',
      hue: (base + HARMONY[(rnd()*HARMONY.length)|0]*(warm?1:-1) + (rnd()-0.5)*40 + 720) % 360,
      sat: 62 + rnd()*38,
      lit: tiny ? 54 + rnd()*24 : 40 + rnd()*26,
      alpha: tiny ? 0.28 + rnd()*0.42 : 0.16 + rnd()*0.34,
    });
  }
}

function stepChips(dt){
  const k = S.driftRate * dt;
  for (const c of chips){
    c.x += c.vx*k; c.y += c.vy*k; c.rot += c.vrot*k;
    // bounce off the chamber wall along the radial normal
    const dx = c.x - CS/2, dy = c.y - CS/2;
    const d = Math.hypot(dx, dy), lim = CR - c.size*0.3;
    if (d > lim){
      const nx = dx/d, ny = dy/d;
      const dot = c.vx*nx + c.vy*ny;
      c.vx -= 2*dot*nx; c.vy -= 2*dot*ny;
      c.x = CS/2 + nx*lim; c.y = CS/2 + ny*lim;
    }
  }
}

function polyPath(g, sides, R, squash){
  g.beginPath();
  for (let i = 0; i < sides; i++){
    const a = (i/sides)*Math.PI*2;
    const x = Math.cos(a)*R, y = Math.sin(a)*R*squash;
    i ? g.lineTo(x,y) : g.moveTo(x,y);
  }
  g.closePath();
}

function paintChips(){
  cc.setTransform(1,0,0,1,0,0);
  cc.globalCompositeOperation = 'source-over';
  cc.fillStyle = '#03040a';
  cc.fillRect(0,0,CS,CS);
  cc.globalCompositeOperation = 'lighter';   // overlapping glass adds light
  for (const c of chips){
    cc.save();
    cc.translate(c.x, c.y);
    cc.rotate(c.rot);
    cc.fillStyle   = `hsla(${c.hue},${c.sat}%,${c.lit}%,${c.alpha})`;
    cc.strokeStyle = `hsla(${c.hue},${Math.min(100,c.sat+12)}%,${Math.min(82,c.lit+26)}%,${c.alpha*0.85})`;
    cc.lineWidth = Math.max(0.8, Math.min(2.4, c.size*0.07));
    if (c.kind === 'disc'){
      cc.beginPath(); cc.ellipse(0,0,c.size,c.size*c.squash,0,0,Math.PI*2);
      cc.fill(); cc.stroke();
    } else if (c.kind === 'ring'){
      cc.lineWidth = Math.max(2, c.size*0.16);
      cc.beginPath(); cc.ellipse(0,0,c.size,c.size*c.squash,0,0,Math.PI*2); cc.stroke();
    } else if (c.kind === 'sliver'){
      cc.beginPath();
      cc.moveTo(-c.size, 0); cc.quadraticCurveTo(0, -c.size*0.42*c.squash, c.size, 0);
      cc.quadraticCurveTo(0, c.size*0.16*c.squash, -c.size, 0);
      cc.closePath(); cc.fill(); cc.stroke();
    } else {
      polyPath(cc, c.sides, c.size, c.squash);
      cc.fill(); cc.stroke();
    }
    cc.restore();
  }
}

function paintImage(){
  cc.setTransform(1,0,0,1,0,0);
  cc.globalCompositeOperation = 'source-over';
  cc.fillStyle = '#000';
  cc.fillRect(0,0,CS,CS);
  const im = S.img;
  const s = Math.max(CS/im.width, CS/im.height);   // cover-fit
  const w = im.width*s, h = im.height*s;
  cc.drawImage(im, (CS-w)/2, (CS-h)/2, w, h);
}

/* ---------- the mirrors ---------- */
function render(){
  const W = cv.width, H = cv.height;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);

  const cx = W/2, cy = H/2;
  const R  = S.circle ? Math.min(W,H)*0.48 : Math.hypot(W,H)/2 + 4;
  const n  = S.folds;
  const beta = Math.PI/n;        // half-sector: the fundamental domain
  const eps  = 0.0022;           // overlap to kill antialiased hairlines at the seams

  for (let k = 0; k < n; k++){
    for (const m of [1,-1]){
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(k*2*beta);
      ctx.scale(1, m);                       // m = -1 is the mirror image
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0,R,-eps,beta+eps);
      ctx.closePath();
      ctx.clip();
      ctx.rotate(S.spin);
      ctx.scale(S.zoom, S.zoom);
      ctx.translate(-S.sx, -S.sy);           // sample point lands on the mirror vertex
      ctx.drawImage(chamber, 0, 0);
      ctx.restore();
    }
  }

  // vignette
  const g = ctx.createRadialGradient(cx,cy,Math.min(W,H)*0.16, cx,cy, Math.hypot(W,H)/2);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.62)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  if (S.circle){
    ctx.save();
    ctx.beginPath();
    ctx.rect(0,0,W,H);
    ctx.arc(cx,cy,R,0,Math.PI*2,true);
    ctx.fill('evenodd');
    ctx.restore();
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

/* ---------- loop ---------- */
let last = 0, tick = 0;
function frame(now){
  const dt = Math.min(64, now - last) / 16.667;   // in 60fps-equivalent ticks
  last = now;
  if (!S.paused){
    S.t += dt;
    S.spin += S.spinRate * 0.0018 * dt;
    if (S.mode === 'chips'){ stepChips(dt); if ((tick++ & 1) === 0) paintChips(); }
  }

  // The sample point sweeps a slow two-frequency orbit through the chamber.
  // Translating it slides fresh chips through the fundamental domain — this is what churns
  // the segments, as distinct from `spin`, which turns the finished rosette rigidly.
  const w  = 0.00235 * S.flow;                       // ~45s for the outer loop
  const ax = Math.cos(S.t*w)*236 + Math.cos(S.t*w*0.37 + 1.7)*152;
  const ay = Math.sin(S.t*w)*236 + Math.sin(S.t*w*0.37 + 0.4)*152;
  let dx = S.ox + ax, dy = S.oy + ay;
  const d = Math.hypot(dx, dy), cap = CR*0.56;
  if (d > cap){ dx *= cap/d; dy *= cap/d; }
  S.sx = CS/2 + dx;
  S.sy = CS/2 + dy;
  render();
  requestAnimationFrame(frame);
}

/* ---------- sizing ---------- */
function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(innerWidth  * dpr);
  cv.height = Math.round(innerHeight * dpr);
}
addEventListener('resize', resize);

/* ---------- the one control ---------- */
const $ = id => document.getElementById(id);
const btn = $('refresh');

function reseed(seed = newSeed()){
  makeChips(seed);
  S.mode = 'chips';
  S.img = null;
  S.ox = 0; S.oy = 0; S.spin = 0; S.t = 0;
  paintChips();
  $('seedLabel').textContent = seed.toString(16).padStart(6,'0');
  location.hash = seed.toString(16);
  btn.classList.remove('turn');
  void btn.offsetWidth;            // restart the CSS transition
  btn.classList.add('turn');
}
btn.onclick = () => reseed();

function useImage(file){
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => { S.img = im; S.mode = 'image'; paintImage(); URL.revokeObjectURL(url); };
  im.src = url;
}

const dropEl = $('drop');
addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('on'); });
addEventListener('dragleave', e => { if (e.relatedTarget === null) dropEl.classList.remove('on'); });
addEventListener('drop', e => {
  e.preventDefault(); dropEl.classList.remove('on');
  const f = [...(e.dataTransfer.files||[])].find(f => f.type.startsWith('image/'));
  if (f) useImage(f);
});

addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); S.paused = !S.paused; }
  else if (e.key === 'n' || e.key === 'N') reseed();
});

/* drag = tilt the tube; scroll = zoom */
let dragging = false, px = 0, py = 0;
cv.addEventListener('pointerdown', e => {
  dragging = true; px = e.clientX; py = e.clientY;
  cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = (e.clientX - px), dy = (e.clientY - py);
  px = e.clientX; py = e.clientY;
  // screen delta -> chamber delta: undo the zoom, then undo the mirror spin
  const s = -1/S.zoom, c = Math.cos(-S.spin), n = Math.sin(-S.spin);
  S.ox += (dx*c - dy*n) * s;
  S.oy += (dx*n + dy*c) * s;
});
const endDrag = () => { dragging = false; cv.classList.remove('dragging'); };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  S.zoom = Math.min(6, Math.max(0.8, S.zoom * Math.exp(-e.deltaY * 0.0012)));
}, { passive:false });

/* ---------- go ---------- */
resize();
reseed(parseInt(location.hash.slice(1), 16) || newSeed());   // #<hex> restores a fragment
requestAnimationFrame(now => { last = now; frame(now); });
})();
</script>
</body>
</html>
